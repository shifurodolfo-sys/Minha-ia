<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha IA Pessoal - Pro</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --sidebar-bg: rgba(30, 30, 36, 0.95);
            --text-color: #e2e2e2;
            --primary-color: #8a2be2;
            --primary-glow: rgba(138, 43, 226, 0.4);
            --msg-user: #2a2a35;
            --msg-ai: #1a1a20;
            --border-color: #333342;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Barra Lateral */
        #sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #new-chat-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        #new-chat-btn:hover {
            background: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: transparent;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .history-item:hover {
            background-color: var(--msg-user);
            border-color: var(--border-color);
        }

        .history-item.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Área Principal */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at top right, #1a1025, var(--bg-color));
        }

        .mobile-menu-btn {
            display: none;
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--msg-user);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 50;
            cursor: pointer;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message-container {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        .message-container.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-container.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 1rem;
        }

        .user .message {
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .ai .message {
            background-color: var(--msg-ai);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .ai .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }

        .msg-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            padding: 0 5px;
        }

        .speak-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .speak-btn:hover {
            color: var(--primary-color);
        }

        /* Área de Input */
        #input-area {
            padding: 20px;
            background: rgba(15, 15, 19, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #image-preview {
            display: none;
            position: absolute;
            bottom: 90px;
            left: 20px;
            background: var(--msg-ai);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 15px var(--primary-glow);
            z-index: 10;
        }

        #image-preview img {
            height: 60px;
            border-radius: 6px;
        }

        #image-preview span {
            cursor: pointer;
            color: #ff4d4d;
            margin-left: 10px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .input-box {
            flex: 1;
            display: flex;
            background-color: var(--msg-user);
            border-radius: 24px;
            padding: 8px 15px;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            align-items: center;
        }

        .input-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            outline: none;
            font-size: 1rem;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 8px;
            font-size: 1.3rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .action-btn:hover {
            color: var(--primary-color);
            background: rgba(138, 43, 226, 0.1);
        }

        #send-btn {
            background-color: var(--primary-color);
            color: white;
            width: 48px;
            height: 48px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        #send-btn:hover {
            background-color: #9d4edd;
            transform: scale(1.05);
        }

        /* Loading */
        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 15px 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute;
                height: 100%;
                transform: translateX(-100%);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            .mobile-menu-btn {
                display: block;
            }
            #chat-container {
                padding-top: 60px;
            }
            .message-container { max-width: 95%; }
        }
    </style>
</head>
<body>

    <!-- Botão Menu Mobile -->
    <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>

    <!-- Barra Lateral -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>✨ Minha IA Pro</h2>
            <button id="new-chat-btn" onclick="startNewChat()">+ Nova Conversa</button>
        </div>
        <div id="chat-history"></div>
    </div>

    <!-- Área Principal -->
    <div id="main-area">
        <div id="chat-container"></div>

        <div id="image-preview">
            <img id="preview-img" src="" alt="Preview">
            <span onclick="removeImage()">×</span>
        </div>

        <div id="input-area">
            <button class="action-btn" onclick="document.getElementById('file-input').click()" title="Anexar imagem">📎</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            
            <div class="input-box">
                <input type="text" id="user-input" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
            </div>

            <button class="action-btn" id="send-btn" onclick="sendMessage()" title="Enviar">➤</button>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DA API ---
        const API_KEY = "AQ.Ab8RN6KmgTQyjniR8UD5bG-BcgDqr-XjAbxK4k3kJgwMWaUH9w";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${API_KEY}`;

        let currentChatId = Date.now().toString();
        let chats = JSON.parse(localStorage.getItem('my_ai_chats_pro')) || {};
        let currentImageBase64 = null;

        window.onload = () => {
            loadHistorySidebar();
            if (chats[currentChatId]) {
                renderMessages(chats[currentChatId].messages);
            } else {
                addMessageToScreen("Olá! Sou sua IA avançada. Como posso te ajudar hoje?", 'ai');
            }
        };

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImageBase64 = e.target.result;
                    document.getElementById('preview-img').src = currentImageBase64;
                    document.getElementById('image-preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImageBase64 = null;
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('file-input').value = '';
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                const voices = window.speechSynthesis.getVoices();
                const ptVoice = voices.find(v => v.lang.includes('pt-BR'));
                if (ptVoice) utterance.voice = ptVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessageToScreen(text, sender, imgUrl = null) {
            const chatContainer = document.getElementById('chat-container');
            
            const containerDiv = document.createElement('div');
            containerDiv.className = `message-container ${sender}`;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            let formattedText = text.replace(/\n/g, '<br>');
            msgDiv.innerHTML = `<p>${formattedText}</p>`;

            if (imgUrl) {
                const img = document.createElement('img');
                img.src = imgUrl;
                msgDiv.appendChild(img);
            }

            containerDiv.appendChild(msgDiv);

            // Botão de ouvir (apenas para IA)
            if (sender === 'ai' && text) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'msg-actions';
                const speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.innerHTML = '🔊 Ouvir';
                // Pega apenas o texto limpo para falar
                speakBtn.onclick = () => speakText(msgDiv.innerText);
                actionsDiv.appendChild(speakBtn);
                containerDiv.appendChild(actionsDiv);
            }

            chatContainer.appendChild(containerDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text && !currentImageBase64) return;

            addMessageToScreen(text || "Analise esta imagem.", 'user', currentImageBase64);
            
            if (!chats[currentChatId]) {
                chats[currentChatId] = { title: text ? text.substring(0, 25) + "..." : "Imagem enviada", messages: [] };
            }
            chats[currentChatId].messages.push({ role: 'user', text: text, img: currentImageBase64 });
            saveChats();
            loadHistorySidebar();

            inputField.value = '';
            const imgToSend = currentImageBase64;
            removeImage();

            // Animação de digitando
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message-container ai';
            loadingDiv.innerHTML = `<div class="message typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            document.getElementById('chat-container').appendChild(loadingDiv);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;

            const parts = [{ text: text || "O que tem nesta imagem?" }];
            if (imgToSend) {
                const base64Data = imgToSend.split(',')[1];
                const mimeType = imgToSend.split(';')[0].split(':')[1];
                parts.push({
                    inline_data: {
                        mime_type: mimeType,
                        data: base64Data
                    }
                });
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();
                loadingDiv.remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    addMessageToScreen(aiText, 'ai');
                    chats[currentChatId].messages.push({ role: 'ai', text: aiText });
                    saveChats();
                } else {
                    addMessageToScreen("Ops, ocorreu um erro. Verifique a chave da API ou tente novamente.", 'ai');
                    console.error("Erro na API:", data);
                }
            } catch (error) {
                loadingDiv.remove();
                addMessageToScreen("Erro de conexão com o servidor. Verifique sua internet.", 'ai');
                console.error(error);
            }
        }

        function saveChats() {
            localStorage.setItem('my_ai_chats_pro', JSON.stringify(chats));
        }

        function loadHistorySidebar() {
            const historyDiv = document.getElementById('chat-history');
            historyDiv.innerHTML = '';
            const sortedKeys = Object.keys(chats).sort((a, b) => b - a);

            sortedKeys.forEach(id => {
                const chat = chats[id];
                const div = document.createElement('div');
                div.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                div.textContent = chat.title || "Nova Conversa";
                div.onclick = () => loadChat(id);
                historyDiv.appendChild(div);
            });
        }

        function loadChat(id) {
            currentChatId = id;
            renderMessages(chats[id].messages);
            loadHistorySidebar();
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function renderMessages(messages) {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = '';
            messages.forEach(msg => {
                addMessageToScreen(msg.text, msg.role, msg.img);
            });
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            document.getElementById('chat-container').innerHTML = '';
            addMessageToScreen("Nova conversa iniciada. O que vamos fazer?", 'ai');
            loadHistorySidebar();
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
    </script>
</body>
</html>
